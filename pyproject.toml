[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booktranslator"
version = "0.1.0"
description = "Dịch sách (TXT, Markdown, EPUB) bằng Claude, có bảng thuật ngữ và lưu tiến độ để chạy tiếp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
booktranslator = "booktranslator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
